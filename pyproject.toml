[tool.poetry]
name = "lsi-explorer"
version = "0.1.0"
description = "Land Suitability Explorer: LSI processing library, CLI, MCP tools and dashboard for EOCube.Ro"
authors = ["Raul Heciko <hecikoraul@yahoo.com>"]
readme = "README.md"
packages = [{ include = "lsi_explorer", from = "src" }]
include = [
    { path = "src/lsi_explorer/locales/*.yml", format = ["sdist", "wheel"] },
    { path = "src/lsi_explorer/dashboard/assets/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.10"
pyyaml = ">=6.0"
numpy = { version = ">=2.0", optional = true }
pandas = { version = ">=2.2", optional = true }
rasterio = { version = ">=1.4", optional = true }
pyproj = { version = ">=3.6", optional = true }
shapely = { version = ">=2.0", optional = true }
pillow = { version = ">=10", optional = true }
plotly = { version = ">=6.0", optional = true }
kaleido = { version = ">=1.0", optional = true }
geopandas = { version = ">=1.0", optional = true }
click = { version = ">=8.1", optional = true }
streamlit = { version = ">=1.50", optional = true }
folium = { version = ">=0.18", optional = true }
streamlit-folium = { version = ">=0.24", optional = true }
pyarrow = { version = ">=17", optional = true }
mcp = { version = ">=1.10", optional = true }

[tool.poetry.extras]
raster = ["numpy", "pandas", "rasterio", "pyproj", "shapely", "pillow"]
charts = ["plotly", "kaleido"]
services = ["geopandas"]
cli = ["click"]
app = [
    "numpy", "pandas", "rasterio", "pyproj", "shapely", "pillow", "plotly", "geopandas",
    "click", "streamlit", "folium", "streamlit-folium", "pyarrow",
]
mcp = ["mcp", "click"]
full = [
    "numpy", "pandas", "rasterio", "pyproj", "shapely", "pillow", "plotly", "kaleido",
    "geopandas", "click", "streamlit", "folium", "streamlit-folium", "pyarrow", "mcp",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
black = ">=24"
pip-licenses = ">=5"

[tool.poetry.scripts]
lsi = "lsi_explorer.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

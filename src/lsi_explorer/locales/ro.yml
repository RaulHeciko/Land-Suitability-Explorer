    howto:
      title: "Cum se citesc datele"
      body: |-
        - **Favorabilitatea** este un scor 0-100 grupat în 10 clase: **C1 = cea mai favorabilă** (90-100) ... **C10 = cea mai puțin favorabilă** (0-10).
        - **Schimbarea** = viitor - prezent, grupată în 5 clase: < -10, -10 până la -5, -5 până la 5 (fără schimbare semnificativă), 5 până la 10, > 10 puncte.
        - **Factorul climatic** combină direcția schimbării favorabilității cu direcția schimbării temperaturii și a precipitațiilor.
        - Suprafețele sunt în km²; fiecare pixel de 100 m (0,01 km²) este luat în calcul.

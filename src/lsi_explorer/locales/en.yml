    howto:
      title: "How to read the data"
      body: |-
        - **Suitability** is a 0-100 score grouped into 10 classes: **C1 = most suitable** (90-100) ... **C10 = least** (0-10).
        - **Change** = future - present, grouped into 5 classes: < -10, -10 to -5, -5 to 5 (no significant change), 5 to 10, > 10 points.
        - **Climate driver** combines the direction of the suitability change with the direction of temperature and precipitation change.
        - Areas are in km²; every 100 m pixel (0.01 km²) is counted.
